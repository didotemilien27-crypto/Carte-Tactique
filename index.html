<style>
:root{--bg:#0a1128;--bg2:#101a3a;--line:#2a3a66;--txt:#e8eefc;--dim:#8d9bbd;--acc:#4fc3ff;--warn:#ffb347}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em}
#map{position:absolute;inset:0}
.hud{position:absolute;z-index:2;background:rgba(10,17,40,.92);border:1px solid var(--line);backdrop-filter:blur(6px)}
button,select,input{background:var(--bg2);color:var(--txt);border:1px solid var(--line);padding:7px 12px;font:inherit;border-radius:0}
button,select{cursor:pointer}
button:hover,button:focus-visible,select:focus-visible,input:focus-visible{border-color:var(--acc);outline:none}
#search{top:calc(10px + env(safe-area-inset-top));left:10px;width:min(340px,calc(100% - 190px));padding:0}
#q{width:100%;border:0;padding:9px 12px}
#res{display:none;border-top:1px solid var(--line);max-height:260px;overflow:auto}
#res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}#res div:hover{background:var(--bg2)}
#tools{top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px;padding:6px}
#route{top:calc(58px + env(safe-area-inset-top));left:10px;width:min(340px,calc(100% - 20px));padding:12px;display:none;max-height:50%;overflow:auto}
#route .pts{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;margin-bottom:8px}
#route b{color:var(--acc)}#route .sum{font-size:18px;margin:6px 0}
#route ol{margin:8px 0 0;padding-left:20px;color:var(--dim)}#route li{margin:3px 0}
#route .row{display:flex;gap:6px}#route .row>*{flex:1}
#off{top:calc(58px + env(safe-area-inset-top));right:10px;width:270px;padding:12px;display:none}
#off.open{display:block}#off h3{margin:0 0 8px;font-size:16px}
#off .row{margin:6px 0;display:flex}#off .row>*{flex:1}
#bar{height:3px;background:var(--line);margin-top:6px}#bar i{display:block;height:100%;width:0;background:var(--acc)}
#msg{color:var(--dim);margin-top:8px;min-height:20px}
#coords{bottom:calc(10px + env(safe-area-inset-bottom));left:10px;padding:5px 10px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
#dot{width:8px;height:8px;border-radius:50%;background:#3ddc97}#dot.off{background:var(--warn)}
#diag{color:var(--warn)}
#panel{top:0;right:0;bottom:0;width:340px;max-width:100%;padding:calc(56px + env(safe-area-inset-top)) 18px 18px;transform:translateX(100%);transition:transform .22s ease;overflow:auto;z-index:3}
#panel.open{transform:none}
#panel h2{margin:0 0 2px;font-size:22px;font-weight:600}#panel .kind{color:var(--acc);margin-bottom:10px}
#panel .row{display:flex;gap:6px;margin:10px 0}#panel .row button{flex:1}
#panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}#panel dt{color:var(--dim)}#panel dd{margin:0;word-break:break-word}
#close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px}
#boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);color:var(--dim);text-align:center;padding:24px}
.pin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0a1128;border:2px solid #0a1128}
@media(max-width:640px){#panel{top:auto;left:0;width:100%;height:50%;padding-top:16px;transform:translateY(100%)}#panel.open{transform:none}#close{top:10px}#off{left:10px;width:auto}}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
.maplibregl-ctrl-group{background:var(--bg2)!important;border:1px solid var(--line)}

.maplibregl-ctrl-attrib{background:rgba(10,17,40,.7)!important;color:var(--dim)!important}.maplibregl-ctrl-attrib a{color:var(--dim)!important}

 background:linear-gradient(var(--acc),var(--acc)) 50% 0/1px 8px no-repeat,linear-gradient(var(--acc),var(--acc)) 50% 100%/1px 8px no-repeat,
 linear-gradient(var(--acc),var(--acc)) 0 50%/8px 1px no-repeat,linear-gradient(var(--acc),var(--acc)) 100% 50%/8px 1px no-repeat}

#marks.open{display:block}#marks h3{margin:0 0 8px;font-size:16px}
#marks .m{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}#marks .m span{flex:1;cursor:pointer}#marks .m button{padding:2px 8px}

@media(max-width:640px){#marks{left:10px;width:auto}}
#viewer{position:fixed;left:0;right:0;bottom:0;height:min(54%,540px);z-index:10;background:rgba(5,9,22,.97);border-top:1px solid var(--acc);display:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#viewer.open{display:block}#v-box{height:100%;display:flex;flex-direction:column;gap:6px;max-width:900px;margin:0 auto}
#v-img{flex:1;min-height:0;width:100%;object-fit:contain;background:#050916;border:1px solid var(--line)}
#v-cap{color:var(--dim);font-size:13px}#v-box .row{display:flex;gap:6px}#v-box .row>*{flex:1;padding:7px 4px}
#p-photos{display:flex;gap:6px;margin:10px 0;overflow-x:auto}#p-photos img{height:64px;width:86px;object-fit:cover;border:1px solid var(--line);cursor:pointer;flex:none}
#checks div{padding:2px 0}
.me{position:relative;width:40px;height:40px}
.me .dot{position:absolute;left:11px;top:11px;width:18px;height:18px;border-radius:50%;background:#4fc3ff;border:3px solid #fff;box-shadow:0 0 0 0 rgba(79,195,255,.6);animation:pulse 2s infinite}
.me .arr{position:absolute;inset:0;display:none}.me .arr::before{content:"";position:absolute;left:12px;top:-6px;border:8px solid transparent;border-top:0;border-bottom:14px solid #4fc3ff}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(79,195,255,0)}100%{box-shadow:0 0 0 0 rgba(79,195,255,0)}}
#guide{top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));padding:10px 14px;z-index:5;display:none;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
#g-arrow{font-size:38px;line-height:1;color:var(--acc);min-width:44px;text-align:center;cursor:pointer}#g-text{font-size:20px;font-weight:600}#g-sub{color:var(--dim)}
.g-btns{display:flex;flex-direction:column;gap:6px}
body.guiding #search,body.guiding #route,body.guiding #tools,body.guiding #off,body.guiding #marks{display:none!important}
@media(prefers-reduced-motion:reduce){.me .dot{animation:none}}
</style>

<body>
<div id="boot">Chargement de la carte…</div>
<div id="map"></div>

<div class="hud" id="search"><input id="q" type="search" placeholder="Rechercher un lieu, une adresse…" autocomplete="off"><div id="res"></div></div>
<div class="hud" id="tools"><button id="b-dl">Télécharger la carte</button><button id="b-gps">Ma position</button><button id="b-route">Itinéraire</button><button id="b-marks">Repères</button><button id="b-strict" title="Coupe tous les accès réseau : seules les données déjà téléchargées sont utilisées">Mode autonome</button><button id="b-grid" class="on">Grille</button><button id="b-app">Installer</button><button id="b-off">Hors-ligne</button><button id="b-3d">Vue 3D</button></div>

<div class="hud" id="route">
  <div class="pts"><b>A</b><span id="r-a">—</span><b>B</b><span id="r-b">—</span></div>
  <div class="row"><select id="r-mode" aria-label="Mode"><option value="car">Voiture</option><option value="bike">Vélo</option><option value="foot">À pied</option></select><button id="r-me">Ma position</button><button id="r-go">Guidage</button><button id="r-swap">Inverser</button><button id="r-clear">Effacer</button></div>
  <div class="hint">Cliquez sur la carte, puis « Départ ici » et « Arrivée ici ».</div><div class="sum" id="r-sum"></div><div id="r-note" style="color:var(--warn)"></div><ol id="r-steps"></ol>
</div>

<div class="hud" id="off">
  <h3>Cartes hors-ligne</h3>
  <div class="row"><button id="b-world">Monde entier (z0–5)</button></div>
  <div class="row"><select id="zmax" aria-label="Zoom maximal"><option value="10">Vue actuelle → z10 (régions)</option><option value="12">Vue actuelle → z12 (villes)</option><option value="14" selected>Vue actuelle → z14 (rues, bâtiments)</option></select></div>
  <div class="row"><button id="b-area">Télécharger la vue actuelle</button></div>
  <div class="row"><button id="b-clear">Tout effacer</button></div>
  <div class="row"><button id="b-check">Vérifier le hors-ligne</button></div><div id="checks"></div>
  <div class="row"><button id="b-export">Enregistrer l’appli autonome (1 fichier)</button></div>
  <div class="row" id="swrow" style="display:none"><button id="b-sw">Option avancée : sw.js</button></div>
  <div id="bar"><i></i></div><div id="msg">Les zones consultées en ligne sont aussi mémorisées automatiquement.</div>
</div>

<div class="hud" id="marks"><h3>Repères enregistrés</h3><div id="m-list"></div></div>
<div id="viewer" role="dialog" aria-label="Vue au sol"><div id="v-box"><img id="v-img" alt=""><div id="v-cap"></div>
  <div class="row"><button id="v-prev">Précédente</button><button id="v-next">Suivante</button><button id="v-close">Fermer</button></div></div></div>
<div class="hud" id="guide"><div id="g-arrow" title="Recentrer">↑</div><div><div id="g-text">Recherche du signal GPS…</div><div id="g-sub"></div></div><div class="g-btns"><button id="g-voice" class="on">Voix</button><button id="g-stop">Arrêter</button></div></div>
<div id="hair"></div>
<div class="hud" id="coords"><span id="clock"></span><span id="dot"></span><span id="net">En ligne</span><span id="pos">—</span><span id="cache" style="color:var(--dim)"></span><span id="swst" style="color:#3ddc97"></span><span id="diag"></span></div>

<aside class="hud" id="panel" aria-live="polite">
  <button id="close" aria-label="Fermer">Fermer</button>
  <h2 id="p-title"></h2><div class="kind" id="p-kind"></div>
  <div class="row"><button id="p-from">Départ ici</button><button id="p-to">Arrivée ici</button><button id="p-mark">Marquer</button><button id="p-ph">Photos</button></div>
  <div id="p-photos"></div><dl id="p-data"></dl>
</aside>

<script>
/* ===================== CONFIG ===================== */
const ML = "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl";
const TILEJSON = "https://tiles.openfreemap.org/planet";               // tuiles vectorielles mondiales (OpenStreetMap)
const GLYPHS = "https://tiles.openfreemap.org/fonts";                  // polices des noms
const ROUTER = "https://routing.openstreetmap.de/routed-";             // + car | bike | foot
const NOMINATIM = "https://nominatim.openstreetmap.org";               // recherche + infos bâtiments
const COMMONS = "https://commons.wikimedia.org/w/api.php";             // photos géolocalisées libres (Wikimedia Commons)
const FONT = "Noto Sans Regular";
const GLYPH_RANGES = ["0-255","256-511","512-767","768-1023","1024-1279","1280-1535","1536-1791","7680-7935","8192-8447","8448-8703"];
const LANG = "fr";
const FRLOC = {"AttributionControl.ToggleAttribution":"Afficher les crédits","AttributionControl.MapFeedback":"Signaler un problème","FullscreenControl.Enter":"Plein écran","FullscreenControl.Exit":"Quitter le plein écran","GeolocateControl.FindMyLocation":"Ma position","GeolocateControl.LocationNotAvailable":"Position indisponible","LogoControl.Title":"Logo MapLibre","NavigationControl.ResetBearing":"Remettre le nord","NavigationControl.ZoomIn":"Zoom avant","NavigationControl.ZoomOut":"Zoom arrière","ScaleControl.Feet":"pi","ScaleControl.Meters":"m","ScaleControl.Kilometers":"km","ScaleControl.Miles":"mi","ScaleControl.NauticalMiles":"nm"};

let strict = false;                                    // « Mode autonome » : aucune requête réseau
const online = () => navigator.onLine && !strict;
const $ = id => document.getElementById(id);
const diag = m => { $("diag").textContent = m ? "⚠ " + m : ""; };
addEventListener("error", e => { if ($("boot")) $("boot").textContent = "Erreur : " + e.message; });
addEventListener("unhandledrejection", e => { if ($("boot")) $("boot").textContent = "Erreur : " + (e.reason && e.reason.message || e.reason); });

/* ===================== Stockage local (IndexedDB) ===================== */
const dbp = new Promise((ok, ko) => { const r = indexedDB.open("carte-tactique", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const idb = (mode, fn) => dbp.then(db => new Promise((ok, ko) => { const q = fn(db.transaction("kv", mode).objectStore("kv")); q.onsuccess = () => ok(q.result); q.onerror = () => ko(q.error); }));
const kvGet = k => idb("readonly", s => s.get(k)).catch(() => undefined);
const kvPut = (k, v) => idb("readwrite", s => s.put(v, k)).catch(() => {});
const kvKeys = () => idb("readonly", s => s.getAllKeys()).catch(() => []);
const kvClear = async () => { for (const k of await kvKeys()) if (/^(t|g)\//.test(k)) await idb("readwrite", s => s.delete(k)); };
const pipe = (buf, T) => new Response(new Blob([buf]).stream().pipeThrough(new T("gzip"))).arrayBuffer();
const gz = b => window.CompressionStream ? pipe(b, CompressionStream) : b;
const gunz = b => window.DecompressionStream ? pipe(b, DecompressionStream) : b;
async function cachedJSON(key, url){
  let why = ""; const c0 = !online() && await kvGet(key); if (c0) return c0;
  try { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); const j = await r.json(); kvPut(key, j); return j; }
  catch (e) { why = e && e.message || String(e); const j = await kvGet(key); if (j) return j; }
  throw new Error(`impossible de joindre ${new URL(url).host} (${why}). ` +
    (location.protocol === "file:" || window.top !== window ? "Vous êtes dans un aperçu qui bloque Internet : " : "") +
    "ouvrez ce fichier dans un vrai onglet du navigateur, depuis votre propre hébergement en HTTPS ou enregistré sur l’appareil.");
}

/* ===================== Chargement MapLibre (réseau, sinon copie locale) ===================== */
async function lib(name, url, css){
  const inject = t => { const el = document.createElement(css ? "style" : "script"); el.textContent = t; document.head.appendChild(el); };
  if (window.__LIBS && window.__LIBS[name]) return inject(window.__LIBS[name]);
  const cached = await kvGet("lib/" + name);
  if (cached && !online()) return inject(cached);
  try {
    await new Promise((ok, ko) => { const el = document.createElement(css ? "link" : "script");
      if (css) el.rel = "stylesheet"; el[css ? "href" : "src"] = url; el.onload = ok; el.onerror = ko; document.head.appendChild(el); });
    if (!cached) fetch(url).then(r => r.text()).then(t => kvPut("lib/" + name, t)).catch(() => {});
  } catch { if (!cached) throw new Error("Première ouverture : connexion Internet requise pour installer la carte."); inject(cached); }
}

/* ===================== Tuiles : réseau + mémoire locale ===================== */
const tx = (lon, z) => Math.floor((lon + 180) / 360 * 2 ** z);
const ty = (lat, z) => { lat = Math.max(-85.05, Math.min(85.05, lat)) * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * 2 ** z); };
const tilesFor = (b, z0, z1) => { const o = [];
  for (let z = z0; z <= z1; z++) { const n = 2 ** z - 1;
    const x0 = Math.max(0, tx(b.getWest(), z)), x1 = Math.min(n, tx(b.getEast(), z)), y0 = Math.max(0, ty(b.getNorth(), z)), y1 = Math.min(n, ty(b.getSouth(), z));
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) o.push([z, x, y]); }
  return o; };
let TJ;
async function getTile(z, x, y, force){
  const key = `t/${z}/${x}/${y}`, hit = await kvGet(key);
  if (hit) return gunz(hit);
  if (!online() && !force) return new ArrayBuffer(0);
  const res = await fetch(TJ.tiles[0].replace("{z}", z).replace("{x}", x).replace("{y}", y));
  if (res.status === 404) { kvPut(key, await gz(new ArrayBuffer(0))); return new ArrayBuffer(0); }
  if (!res.ok) throw new Error("tuile " + res.status);
  let buf = await res.arrayBuffer(); const u = new Uint8Array(buf);
  if (u[0] === 0x1f && u[1] === 0x8b) buf = await gunz(buf);
  kvPut(key, await gz(buf)); return buf;
}
async function glyph(path){
  const key = "g/" + path, hit = await kvGet(key); if (hit) return hit;
  const i = path.lastIndexOf("/"), res = await fetch(`${GLYPHS}/${encodeURIComponent(path.slice(0, i))}/${path.slice(i + 1)}.pbf`);
  if (!res.ok) throw new Error("police " + res.status);
  const b = await res.arrayBuffer(); kvPut(key, b); return b;
}
async function downloadTiles(list, label, pb){
  const bar = $("bar").firstElementChild; let done = 0, fail = 0, i = 0;
  $("msg").textContent = `${label} : ${list.length} tuiles…`;
  const w = async () => { while (i < list.length) { const [z, x, y] = list[i++];
    try { if (!(await kvGet(`t/${z}/${x}/${y}`))) await getTile(z, x, y, true); } catch { fail++; }
    if (++done % 10 === 0 || done === list.length) { bar.style.width = 100 * done / list.length + "%"; $("msg").textContent = `${label} : ${done}/${list.length}`; } } };
  await Promise.all(Array.from({length: 8}, w));

/* --- Itinéraire hors-ligne : graphe construit à partir des routes des tuiles téléchargées --- */
async function offlineRoute(mode){
  map.fitBounds([[Math.min(A.lng, B.lng), Math.min(A.lat, B.lat)], [Math.max(A.lng, B.lng), Math.max(A.lat, B.lat)]], {padding:60, maxZoom:15, duration:0});

  const car = mode === "car", K = v => Math.round(v * 5e4), ids = new Map(), P = [], adj = [];
  const SPD = {motorway:100, trunk:80, primary:60, secondary:50, tertiary:40, minor:30, service:15, track:15};
  const node = c => { const k = K(c[0]) + "," + K(c[1]); let i = ids.get(k); if (i === undefined) { i = P.length; ids.set(k, i); P.push(c); adj.push([]); } return i; };
  for (const f of map.querySourceFeatures("ofm", {sourceLayer:"transportation"})) {
    const c = f.properties.class;
    if (car ? !SPD[c] : (c === "motorway" || c === "trunk" || !(SPD[c] || c === "path" || c === "pedestrian"))) continue;
    const kmh = car ? SPD[c] : mode === "bike" ? 15 : 5, g = f.geometry, lines = g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : [];

      const d = hav({lng:L[k - 1][0], lat:L[k - 1][1]}, {lng:L[k][0], lat:L[k][1]}), t = d / (kmh / 3.6); adj[a].push([b, t, d]); adj[b].push([a, t, d]); }
  }

    for (const [v, t, m] of adj[u]) if (d + t < dist[v]) { dist[v] = d + t; prev[v] = u; len[v] = len[u] + m; push([d + t, v]); } }

}

const MOD = {left:"à gauche", right:"à droite", "slight left":"légèrement à gauche", "slight right":"légèrement à droite", "sharp left":"franchement à gauche", "sharp right":"franchement à droite"};

/* --- Grille tactique de coordonnées (pas adaptatif selon le zoom) --- */

  const b = map.getBounds(), z = map.getZoom(), st = z < 2.5 ? 30 : z < 4.5 ? 10 : z < 6.5 ? 5 : z < 8.5 ? 1 : z < 11 ? .5 : z < 13 ? .1 : z < 15 ? .05 : .01;

  const r = v => Math.round(v * 1e5) / 1e5, L = c => ({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:c}});
  for (let x = w; x <= e && f.length < 120; x += st) f.push(L([[r(x), s0], [r(x), n]]));

  $("g-arrow").onclick = () => { gps.follow = true; if (gps.pos) map.easeTo({center:[gps.pos.lng, gps.pos.lat], zoom:Math.max(map.getZoom(), 16.5)}); };
  $("g-voice").onclick = e => { guide.voice = !guide.voice; e.target.classList.toggle("on", guide.voice); if (!guide.voice && window.speechSynthesis) speechSynthesis.cancel(); };
  map.on("dragstart", () => { gps.follow = false; }); map.on("rotate", updateArrow);
  document.addEventListener("visibilitychange", () => { if (guide.on && document.visibilityState === "visible") wake(); });
  $("p-ph").onclick = () => { if (!picked) return; const l = nearest(picked, 60, 3000); l.length ? openViewer(l, 0, picked) : diag("aucune photo proche (zoomez ou téléchargez la zone en ligne)"); };
  $("v-close").onclick = closeViewer;
  $("v-prev").onclick = () => { pv.i = (pv.i - 1 + pv.list.length) % pv.list.length; showPhoto(); };
  $("v-next").onclick = () => { pv.i = (pv.i + 1) % pv.list.length; showPhoto(); };
  addEventListener("keydown", e => { if (!$("viewer").classList.contains("open")) return;
    if (e.key === "Escape") $("v-close").click(); const D = {ArrowLeft:"v-prev", ArrowRight:"v-next", PageUp:"v-prev", PageDown:"v-next"}; if (D[e.key]) { e.preventDefault(); $(D[e.key]).click(); } });
  $("p-mark").onclick = () => { if (!picked) return; marks.push({id:Date.now(), name:$("p-title").textContent, lng:picked.lng, lat:picked.lat}); kvPut("marks", marks); drawMarks(); $("off").classList.remove("open"); $("marks").classList.add("open"); };
  $("b-marks").onclick = () => { $("off").classList.remove("open"); $("marks").classList.toggle("open"); };
  $("b-route").onclick = () => { routeOpen = !routeOpen; routeUI(); };
  $("r-me").onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(
    p => { const ll = {lng:p.coords.longitude, lat:p.coords.latitude}; setPoint("A", ll, "Ma position"); map.flyTo({center:[ll.lng, ll.lat], zoom:15}); },
    () => diag("position refusée ou indisponible"), {enableHighAccuracy:true, timeout:10000}) : diag("géolocalisation non prise en charge");
  $("q").onkeydown = e => { if (e.key === "Enter") { clearTimeout(qt); search(e.target.value.trim()); } };
  $("p-from").onclick = () => picked && setPoint("A", picked, $("p-title").textContent);
  $("p-to").onclick = () => picked && setPoint("B", picked, $("p-title").textContent);
  $("r-mode").onchange = () => A && B && compute();
  $("r-swap").onclick = () => { if (A && B) { const a = A, b = B; setPoint("A", b, b.name); setPoint("B", a, a.name); } };
  $("r-clear").onclick = clearRoute;
  $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => search(e.target.value.trim()), 450); };
  $("b-strict").onclick = async e => { strict = !strict; e.target.classList.toggle("on", strict); await kvPut("strict", strict); net(); navigator.serviceWorker && navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({strict});
    $("msg").textContent = strict ? "Mode autonome : plus aucune requête réseau, seules les données téléchargées sont utilisées." : "Retour en ligne."; $("off").classList.add("open"); };
  $("b-3d").onclick = () => map.easeTo({pitch: map.getPitch() > 10 ? 0 : 60, duration:600});
  // Un clic : télécharge la zone visible avec le meilleur niveau de détail raisonnable (≈ 4000 tuiles max), sinon le monde en basse résolution
  $("b-dl").onclick = () => {
    $("marks").classList.remove("open"); $("off").classList.add("open");
    const b = map.getBounds(), z0 = Math.max(0, Math.floor(map.getZoom())), W = new maplibregl.LngLatBounds([-180, -85], [180, 85]);
    let z1 = 14, list = tilesFor(b, z0, z1), label, pb = b;
    while (list.length > 4000 && z1 > z0) list = tilesFor(b, z0, --z1);
    if (list.length > 4000 || z1 < 8) { list = tilesFor(W, 0, 5); label = "Monde (basse résolution)"; pb = null; }
    else { if (z0 > 0) list = list.concat(tilesFor(W, 0, Math.min(4, z0 - 1))); label = `Zone jusqu’au zoom ${z1} (≈ ${Math.round(list.length * 0.03)} Mo)`; }
    downloadTiles(list, label, pb);
  };
  $("b-off").onclick = () => { $("marks").classList.remove("open"); $("off").classList.toggle("open"); };
  $("b-world").onclick = () => downloadTiles(tilesFor(new maplibregl.LngLatBounds([-180, -85], [180, 85]), 0, 5), "Monde");
  $("b-area").onclick = () => { const z1 = +$("zmax").value, list = tilesFor(map.getBounds(), Math.max(0, Math.floor(map.getZoom())), z1);
    if (list.length > 300000) { $("msg").textContent = "Zone trop grande : zoomez ou réduisez le zoom maximal."; return; }
    if (list.length > 30000 && !confirm(`${list.length} tuiles (volumineux). Continuer ?`)) return;
    downloadTiles(list, "Zone", map.getBounds()); };
  $("b-clear").onclick = async () => { if (confirm("Effacer toutes les cartes hors-ligne ?")) { await kvClear(); $("msg").textContent = "Mémoire effacée."; stats(); } };
  stats();
}

/* --- Réseau + manifeste PWA intégré --- */
const net = () => { $("dot").className = online() ? "" : "off"; $("net").textContent = strict ? "Mode autonome" : online() ? "En ligne" : "Hors ligne"; };
addEventListener("online", net); addEventListener("offline", net); net();
let deferred; addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
$("b-app").onclick = () => { if (deferred) { deferred.prompt(); deferred = null; return; }
  alert("Installer l’application :\n• iPhone / iPad (Safari) : bouton Partager → « Sur l’écran d’accueil ».\n• Android (Chrome) : menu ⋮ → « Installer l’application ».\n• Ordinateur (Chrome / Edge) : icône d’installation dans la barre d’adresse.\n\nLa page doit être ouverte depuis un hébergement HTTPS."); };
const icon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0a1128"/><circle cx="256" cy="256" r="120" fill="none" stroke="#4fc3ff" stroke-width="16"/><path d="M256 96v320M96 256h320" stroke="#7f9cc4" stroke-width="12"/></svg>');
const lk = document.createElement("link"); lk.rel = "manifest";
lk.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify({name:"Carte tactique", short_name:"Carte", start_url:location.href, display:"standalone", background_color:"#0a1128", theme_color:"#0a1128", icons:[{src:icon, sizes:"512x512", type:"image/svg+xml"}]}));
document.head.appendChild(lk);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
const SW_SRC = `// Service worker de la carte tactique : permet d'ouvrir l'application sans aucun réseau.
const C = "carte-tactique-v1";
let strict = false;
self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", e => e.waitUntil(clients.claim()));
self.addEventListener("message", e => { if (e.data && "strict" in e.data) strict = !!e.data.strict; });
const MF = JSON.stringify({name:"Carte tactique", short_name:"Carte", lang:"fr", start_url:"./", scope:"./", display:"standalone", background_color:"#0a1128", theme_color:"#0a1128",
  icons:[{src:"icon.svg", sizes:"192x192", type:"image/svg+xml"}, {src:"icon.svg", sizes:"512x512", type:"image/svg+xml", purpose:"any"}]});
const ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0a1128"/><circle cx="256" cy="256" r="120" fill="none" stroke="#4fc3ff" stroke-width="16"/><path d="M256 96v320M96 256h320" stroke="#7f9cc4" stroke-width="12"/></svg>';
async function fallback(r){
  const h = await caches.match(r, {ignoreSearch:true}); if (h) return h;
  if (r.mode === "navigate") { const c = await caches.open(C); for (const k of await c.keys()) if (new URL(k.url).pathname.endsWith(".html")) return c.match(k); }
  return Response.error();
}
self.addEventListener("fetch", e => {
  const r = e.request, u = new URL(r.url), own = u.origin === location.origin;
  if (r.method !== "GET") return;
  if (own && u.pathname.endsWith("manifest.webmanifest")) return e.respondWith(new Response(MF, {headers:{"Content-Type":"application/manifest+json"}}));
  if (own && u.pathname.endsWith("icon.svg")) return e.respondWith(new Response(ICON, {headers:{"Content-Type":"image/svg+xml"}}));
  if (!own && u.hostname !== "cdn.jsdelivr.net") return;      // tuiles, photos, services : gérés par la page (mémoire locale)
  e.respondWith((async () => {
    if (strict) return fallback(r);
    try {
      const res = await Promise.race([fetch(r), new Promise((_, no) => setTimeout(no, 4000))]);
      if (res && (res.ok || res.type === "opaque")) { const cp = res.clone(); caches.open(C).then(k => k.put(r, cp)); }
      return res;
    } catch { return fallback(r); }
  })());
});
`;
async function setupSW(){
  if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
  strict = !!(await kvGet("strict"));
  const ready = () => { $("swst").style.color = "#3ddc97"; $("swst").textContent = "· app hors-ligne ✓";
    const m = document.querySelector("link[rel=manifest]"); if (m) m.href = "manifest.webmanifest"; };
  const tell = () => navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({strict});
  try {
    await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    tell(); navigator.serviceWorker.addEventListener("controllerchange", tell);
    if (online()) fetch(location.href.split("#")[0]).catch(() => {});      // met cette page en mémoire pour la rouvrir sans réseau
    ready();
  } catch {
    if (await navigator.serviceWorker.getRegistration()) { tell(); ready(); return; }
    $("swrow").style.display = "flex";
  }
}
$("b-sw").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([SW_SRC], {type:"text/javascript"})); a.download = "sw.js"; a.click(); };
$("b-check").onclick = async () => {
  const keys = await kvKeys(), n = p => keys.filter(k => k.startsWith(p)).length;
  const sw = "serviceWorker" in navigator && !!navigator.serviceWorker.controller;
  const kept = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
  const rows = [[sw, "Application ouvrable sans réseau (sw.js actif)"], [keys.includes("lib/ml.js") && keys.includes("lib/ml.css"), "Moteur de carte en mémoire"],
    [keys.includes("tilejson"), "Définition des tuiles en mémoire"], [n("g/") >= 3, `Polices des noms (${n("g/")})`], [keys.includes("t/0/0/0"), "Monde entier (tuiles de base)"],
    [n("t/") > 0, `Tuiles de carte (${n("t/")})`], [n("b/") > 0, `Photos téléchargées (${n("b/")})`], [kept, "Stockage protégé contre l’effacement"]];
  const box = $("checks"); box.replaceChildren();
  for (const [ok, t] of rows) { const d = document.createElement("div"); d.textContent = (ok ? "✓ " : "✗ ") + t; d.style.color = ok ? "#3ddc97" : "#ffb347"; box.append(d); }
};
setupSW();
$("b-export").onclick = async () => {
  const msg = t => { $("msg").textContent = t; $("off").classList.add("open"); };
  try {
    msg("Préparation du fichier…");
    const get = async (name, url) => (await kvGet("lib/" + name)) || await (await fetch(url)).text();
    const libs = {"ml.css": await get("ml.css", ML + ".css"), "ml.js": await get("ml.js", ML + ".js")};
    const src = await (await fetch(location.href.split("#")[0])).text();
    const OP = "<scr" + "ipt>", CL = "</scr" + "ipt>";                       // évite de fermer la balise script par erreur
    const data = OP + "window.__LIBS=" + JSON.stringify(libs).split("</").join("<\\/") + ";" + CL + "\n" + OP;
    const html = src.replace(OP, () => data);
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], {type:"text/html"})); a.download = "carte-tactique-autonome.html"; a.click();
    msg("Fichier enregistré : il contient toute l’application, ouvrez-le directement depuis l’appareil.");
  } catch (e) { msg("Export impossible : ouvrez la page en ligne depuis votre site, puis réessayez."); }
};
main().catch(e => {
  const b = $("boot"); if (!b) return diag(e.message);
  b.textContent = "Erreur : " + e.message; b.append(document.createElement("br"), document.createElement("br"));
  const r = document.createElement("button"); r.textContent = "Réessayer"; r.onclick = () => location.reload(); b.append(r);
});
</script>
